name: github-agent-channel
services:
  channel:
    build: ..
    profiles: [channel]
    restart: unless-stopped
    init: true
    env_file: ../.env
    environment:
      CHANNEL_CONFIG: /app/config.local.yaml
    volumes:
      - ../config.local.yaml:/app/config.local.yaml:ro
      - channel-data:/data
    ports:
      - 127.0.0.1:18896:3000
    networks: [channel]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:slim}
    restart: unless-stopped
    init: true
    environment:
      HOME: /home/node
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
    command: [node, dist/index.js, gateway, --bind, lan, --port, '18789']
    volumes:
      - ./state/openclaw:/home/node/.openclaw
    networks: [channel]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No host port: access from the Channel network or docker exec for checks.
volumes:
  channel-data:
networks:
  channel:
    driver: bridge
